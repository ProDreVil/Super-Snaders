<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/root.css">
    <link rel="stylesheet" href="../static/css/utilities.css">
    <link rel="stylesheet" href="../static/css/panels.css">
    <title>Super Snaders</title>
</head>
<!-- class="pattern-stripes" -->
<body>
    <header class="header"></header>

    <main class="game-layout">

        <div class="left-panel flex-col">
            <aside class="stats-container container-panel pattern-border">
                <div class="stats-area" id="primary-stats">
                    <div class="stats flex-row flex-centered">
                        <div class="stat-icon">💚</div>
                        <div class="stat-bar"></div>
                        <p class="stat-value">100/100</p>
                    </div>
                    <div class="stats flex-row flex-centered">
                        <div class="stat-icon">💧</div>
                        <div class="stat-bar"></div>
                        <p class="stat-value">100/100</p>
                    </div>
                </div>
                <div class="status-area">
                    <div class="status-icon"></div>
                </div>
            </aside>
            <aside class="inventory-container container-panel pattern-border">
            </aside>
        </div>

        <section class="board-container container-panel pattern-border w-auto">
        </section>

        <div class="right-panel flex-col">
            <aside class="messages-container container-panel pattern-border">
            </aside>
            <aside class="shop-container container-panel pattern-border">
            </aside>
        </div>
        
    </main>
</body>
</html>
